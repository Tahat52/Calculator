<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Calculator</title>
    <link href="app.css" rel="stylesheet" type="text/css" />
     <link rel="icon" href="Icon.jpg" type="image/png" >
    <style>
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: #020617;
        }

        .stars,
        .stars::before,
        .stars::after {
            position: fixed;
            inset: 0;
            content: "";
            pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(1px 1px at 40px 70px, white, transparent),
                radial-gradient(2px 2px at 90px 40px, white, transparent),
                radial-gradient(1px 1px at 130px 90px, white, transparent),
                radial-gradient(2px 2px at 160px 20px, white, transparent),
                radial-gradient(1px 1px at 200px 100px, white, transparent),
                radial-gradient(2px 2px at 250px 50px, white, transparent),
                radial-gradient(1px 1px at 300px 120px, white, transparent);
                

            background-size: 350px 180px;
            animation: moveStars 5s linear infinite;
        }

        .stars::before {
            opacity: 2;
            transform: scale(1);
            animation-duration: 10s;
        }

        .stars::after {
            opacity: 0.25;
            transform: scale(2);
            animation-duration: 35s;
        }

        @keyframes moveStars {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(180px);
            }
        }

        .content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>

</head>

<body>
  
    <div class="stars"></div>
    <div class="container">
        <div class="block"></div>
        <div class="q">
            <div><button class="AC">AC</button></div>
            <div><button class="NEG">+/-</button></div>
            <div><button class="percentage">%</button></div>
            <div><button class="division">/</button></div>
        </div>

        <div class="q">
            <div><button class="seven">7</button></div>
            <div><button class="eight">8</button></div>
            <div><button class="nine">9</button></div>
            <div><button class="multi">X</button></div>
        </div>
        <div class="q">
            <div><button class="four">4</button></div>
            <div><button class="five">5</button></div>
            <div><button class="six">6</button></div>
            <div><button class="negative">-</button></div>
        </div>
        <div class="q">

            <div><button class="one">1</button></div>
            <div><button class="two">2</button></div>
            <div><button class="three">3</button></div>
            <div><button class="plus">+</button></div>
        </div>

        <div class="d">
            <div><button class="c">0</button></div>
            <div><button class="z">.</button> </div>
            <div><button class="y">=</button></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
